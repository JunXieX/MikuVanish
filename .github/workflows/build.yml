name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5

      # 构建统一在 CI 完成（经 Gradle wrapper），三个模块的 jar 均输出到仓库根目录。
      - name: 构建
        run: ./gradlew build --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: MikuVanish
          retention-days: 1
          path: MikuVanish-*.jar
          if-no-files-found: error

      # 推送 v* 标签时发布正式版，并把三个 jar 作为 Release 附件（文件名含版本号，用通配符匹配）。
      - name: 发布正式版
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 标签必须与 gradle.properties 的版本一致，否则 Release 名与产物内版本号会对不上。
          VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 gradle.properties 的版本 v${VERSION} 不一致，终止发版。" >&2
            exit 1
          fi
          # 已存在同名 Release 时直接跳过：重新打标/重跑工作流属正常操作，不应判为失败。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过发布。"
            exit 0
          fi
          # 更新日志取自「打标签的那个提交」的正文（即发版提交的 message）。
          # git 会剥掉标题行，--format=%b 拿到的正是结构化正文；正文为空说明发版提交没写更新日志。
          NOTES_FILE="$(mktemp)"
          git log -1 --format=%b HEAD > "${NOTES_FILE}"
          if [ -z "$(cat "${NOTES_FILE}")" ]; then
            echo "发版提交正文为空：更新日志直接取自该提交正文，请补写后再打标签。" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            MikuVanish-*.jar \
            --title "MikuVanish ${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}"