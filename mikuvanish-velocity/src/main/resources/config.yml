# MikuVanish 代理端配置

# 服务端列表 ping 修正：
#   隐身玩家会从在线人数中扣除，并从玩家样例列表中移除（避免在服务器列表里被看到）。
#   人数以代理全网在线数为基线：开启 ping-passthrough 时客户端看到的是单个后端的人数，
#   而隐身人数是全网的，两者相减没有意义，故此处统一按全网口径计算。
#   仅代理网络下生效——客户端查询的是代理 ping，后端 ping 只影响直连后端的情况。
ping-hide-vanished: true

# 隐身状态落盘间隔（秒）：状态变更后由周期任务异步写盘（原子替换，失败自动重试）。
# 值越小越安全，值越大磁盘写入越少。
save-interval-seconds: 5