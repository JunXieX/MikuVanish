# MikuVanish 后端行为拦截配置
# 默认只拦截会直接暴露隐身者存在的几类行为（聊天 / 伤害 / 拾取 / 丢弃 / 索敌 / 痕迹播报）；
# 世界交互类开关默认关闭——隐身多用于“恶搞”，需要能正常操作世界。
prevent:
  # 聊天发言（消息以 "!" 开头可绕过限制）
  chat: true
  # 玩家间双向伤害（含投射物）；环境/怪物伤害不受限，隐身者仍会正常受到摔落、岩浆等伤害
  damage: true
  # 拾取物品
  pickup: true
  # 丢弃物品（丢弃物会实体化并对他人可见）
  drop: true
  # 生物索敌（怪物锁定隐身玩家时清除目标）
  target: true
  # 存在痕迹播报：死亡消息 / 成就公告 / 袭击触发
  announcements: true
  # 方块破坏
  block-break: false
  # 方块放置（含盔甲架、船、矿车、画等实体放置）
  block-place: false
  # 红石设备交互：按钮 / 拉杆 / 门 / 活板门 / 栅栏门 / 中继器 / 比较器 / 阳光探测器，
  # 以及压力板、耕地、绊线等物理触发。左键破坏不受本开关控制（见 block-break）
  redstone-interact: false
  # 右键实体交互（覆盖骑乘、驯服、拴绳、剪羊毛、与村民/盔甲架交互等）
  entity-interact: false
  # 其它可被他人感知的世界交互：桶倒水/岩浆、采集、激流冲刺、投掷蛋孵化、发声方块（音符盒 / 钟 / 唱片机），
  # 以及射击与投掷物（箭矢、雪球、蛋、末影珍珠、药水、经验瓶、三叉戟、风弹）与抛竿钓鱼
  world-interact: false
  # 可感知的方块改动：
  #   1) 会改变方块外观的右键交互：蛋糕 / 堆肥桶 / 花盆 / 蜡烛 / 营火 / 床位 / 告示牌编辑 /
  #      炼药锅 / 龙蛋 / 雕纹书架 / 甜浆果丛 / 红石矿发光 等（红石元件见 redstone-interact）
  #   2) 物品作用于方块：锄地 / 斧去皮 / 锹铲路 / 骨粉催熟 / 刷怪蛋 / 打火石 / 涂蜡等
  #      —— 这类改动由物品驱动，不会产生 BlockPlaceEvent，只能在此拦截
  # 放置类（方块、船/矿车/盔甲架/画/展示框）与桶类分别由 block-place、world-interact 负责，
  # 纯 UI 方块（工作台/铁砧/附魔台等）与容器不在此列，避免开关相互耦合
  block-modify: false

# 静默容器交互：隐身玩家可以正常打开箱子、木桶、潜影盒、漏斗、末影箱，
# 但不会触发开启动画与音效（类似旁观者的无声开启），防止被玩家察觉。
# 上锁、被上方方块遮挡（含猫坐在箱子上）的容器仍按原版规则处理。
silent-container: true